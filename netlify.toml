[build]
  functions = "netlify/functions"
  publish = "dist"

[dev]
  functions = "netlify/functions"
  publish = "dist"
  framework = "vite"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["axios", "express", "cors", "serverless-http", "dotenv"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server/api/:splat"
  status = 200